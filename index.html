<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合気道 演武ノート</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f4f3;color:#18352e;font:16px system-ui,sans-serif}header{background:#173e35;color:white;padding:24px}main{max-width:900px;margin:auto;padding:16px}section,article{background:white;border:1px solid #dce5df;border-radius:14px;padding:16px;margin:12px 0}h1,h2,h3{margin:0 0 12px}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #b8c9c1;border-radius:8px;background:white;color:inherit;max-width:100%}button{cursor:pointer}button.primary,button.active{background:#245e4e;color:white}nav,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}nav{position:sticky;top:0;background:#f1f4f3;padding:8px 0;z-index:2}label{display:block;font-size:13px;color:#53665d;margin:8px 0}label input,label select,label textarea{display:block;width:100%;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.mat{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:#dce7d3;padding:5px}.mat button{height:65px;background:#edf2e5;border:1px solid #aabda1;font-size:20px}.muted{color:#63756d;font-size:13px}.score{font-size:36px;font-weight:bold}progress{width:100%;accent-color:#245e4e}details{margin:8px 0}summary{cursor:pointer} .hidden{display:none} @media print{nav,button,.no-print{display:none!important}section{break-inside:avoid}body{background:white}main{padding:0}}</style><header><div>近畿大学医学部合気道部</div><h1>演武ノート</h1><div>構成を作る · 稽古する · 改善する</div></header><main><nav id="nav"></nav><div id="app"></div><p class="muted">記録はこのブラウザ内に保存されます。端末間の共有にはバックアップを使用してください。</p></main><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const attacks='片手取り,交差取り,両手取り,諸手取り,肩取り,両肩取り,胸取り,袖取り,両袖取り,肘取り,後ろ両手取り,後ろ両肩取り,後ろ両肘取り,後ろ両袖取り,後ろ襟取り,後ろ首絞め,正面打ち,横面打ち,突き,肩取り面打ち'.split(',');const techs='一教,二教,三教,四教,五教,六教,入り身投げ,四方投げ,小手返し,回転投げ,天地投げ,隅落とし,呼吸投げ,呼吸法,側面入り身投げ'.split(',');const dirs=['↖','↑','↗','←','→','↙','↓','↘'];const fresh=()=>({pose:'立技',side:'右',attack:'交差取り',tech:'一教',type:'表',fall:'固め',dir:'→',tempo:'普通',start:[4,5],end:[4,5]});let s={name:'',date:'',tori:'',uke:'',limit:90,moves:[fresh()],logs:[]};try{Object.assign(s,JSON.parse(localStorage.getItem('enbu-v1')||'{}'))}catch{}let tab=0,idx=0,phase='start',who=0,preview=0, scores=[20,10,10,10], checks={}, seconds=90,memo='',video='',reviewer='';const names=['体勢（姿勢・視線）','極め（残心）','捌き（崩し）','巡り（中心軸）'],max=[40,20,20,20];const criteria=[['背筋と腰が安定している','足元ばかり見ず相手を見る','取りも受けも姿勢が美しい'],['技の終わりが明確','極めが観客から見える','残心を保ち次の構えへ移る'],['自然に攻められる間合い','受けは相手に向かって攻める','崩されたら無理に逆らわず安全に受身へ','力任せでなく相手のバランスを崩す'],['中心軸がぶれない','身体全体で動く','目的なく棒立ちにならない']];const extra=['美しさ：取りと受けの動きが調和する','難易度：実力に合う少し難しい技に安全に挑戦する','スピード：速く動くべきところで動く','緩急：見せるところと素早いところを分ける','間：意味のある間を取る','投げる方向が観客から見やすい','畳を偏りなく使う','最後の残心と礼まで整える'];function save(){try{localStorage.setItem('enbu-v1',JSON.stringify(s))}catch(e){alert('保存できません。バックアップを出力してください。')}}function go(t){tab=t;render()}function set(k,v){s[k]=v;save()}function mv(k,v){s.moves[idx][k]=v;save();render()}function field(label,k,arr){let v=s.moves[idx][k];return `<label>${label}<select onchange="mv('${k}',this.value)">${[...new Set([...arr,v])].map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}function inp(label,k,type='text'){return `<label>${label}<input type="${type}" value="${esc(s[k])}" onchange="set('${k}',this.value)"></label>`}function add(copy){s.moves.splice(idx+1,0,copy?JSON.parse(JSON.stringify(s.moves[idx])):fresh());idx++;save();render()}function shift(d){let j=idx+d;if(j<0||j>=s.moves.length)return;[s.moves[idx],s.moves[j]]=[s.moves[j],s.moves[idx]];idx=j;save();render()}function del(){if(s.moves.length>1){s.moves.splice(idx,1);idx=Math.min(idx,s.moves.length-1);save();render()}}function mat(m,p,edit){return `<div class="muted" style="text-align:center">正面・観客席</div><div class="mat">${Array.from({length:9},(_,i)=>`<button ${edit?`onclick="place(${i})"`:''}>${m[p][0]===i?'🔵取':''}${m[p][1]===i?'🔴受'+(p==='end'?m.dir:''):''}</button>`).join('')}</div><div class="muted" style="text-align:center">入退場側</div>`}function place(i){s.moves[idx][phase][who]=i;save();render()}function list(){return s.moves.map((m,i)=>`<article onclick="idx=${i};render()" style="border-left:5px solid ${i===idx?'#245e4e':'#ddd'}"><b>${i+1}. ${esc(m.attack)} ${esc(m.tech)} ${esc(m.type)}</b><div class="muted">${esc(m.pose)}・${esc(m.side)}・${esc(m.fall)}・${esc(m.dir)}・${esc(m.tempo)}</div></article>`).join('')}function check(x,k){return `<label style="font-size:15px"><input style="display:inline;width:auto" type="checkbox" ${checks[k]?'checked':''} onchange="checks['${k}']=this.checked"> ${x}</label>`}function log(){s.logs.push({date:new Date().toLocaleString('ja-JP'),scores:[...scores],checks:{...checks},seconds:Number(seconds),memo,video,reviewer,moves:JSON.parse(JSON.stringify(s.moves))});save();go(4)}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='演武ノート.json';a.click()}function restore(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{let n=JSON.parse(r.result);if(!Array.isArray(n.moves)||!n.moves.length||!Array.isArray(n.logs))throw 0;s=n;idx=0;save();render()}catch{alert('読み込めないファイルです')}};r.readAsText(f)}function render(){let m=s.moves[idx];$('nav').innerHTML=['構成','立ち位置','プレビュー','稽古・採点','成長記録','共有'].map((x,i)=>`<button class="${tab===i?'active':''}" onclick="go(${i})">${x}</button>`).join('');let h='';if(tab===0)h=`<section><h2>基本情報</h2><div class="grid">${inp('大会名','name')}${inp('開催日','date','date')}${inp('取り（固定）','tori')}${inp('受け（固定）','uke')}${inp('制限時間（秒）','limit','number')}</div></section><section><h2>第${idx+1}技 / 全${s.moves.length}技</h2><div class="grid">${field('姿勢','pose',['座法','半身半立','立技'])}${field('左右','side',['右','左','両'])}${field('攻め方・取り手','attack',attacks)}${field('技名','tech',techs)}${field('表裏','type',['表','裏','区別なし'])}${field('終わり方','fall',['固め','後ろ受身','前回り受身','飛び受身','その他'])}${field('方向（観客席基準）','dir',dirs)}${field('テンポ','tempo',['ゆっくり','普通','素早く'])}</div><div class="row"><button onclick="let v=prompt('攻め方');if(v)mv('attack',v)">攻め方を追加</button><button onclick="let v=prompt('技名');if(v)mv('tech',v)">技名を追加</button></div><p class="row"><button class="primary" onclick="add(false)">＋ 技を追加</button><button onclick="add(true)">複製</button><button onclick="shift(-1)">↑</button><button onclick="shift(1)">↓</button><button onclick="del()">削除</button></p></section><h2>技順</h2>${list()}`;if(tab===1)h=`<section><h2>第${idx+1}技の立ち位置</h2><div class="row"><button onclick="idx=Math.max(0,idx-1);render()">前の技</button><button onclick="idx=Math.min(s.moves.length-1,idx+1);render()">次の技</button></div><p>${esc(m.attack)}・${esc(m.tech)}</p><div class="row">${['start','end'].map((p,i)=>`<button class="${phase===p?'active':''}" onclick="phase='${p}';render()">${i?'終了位置':'開始位置'}</button>`).join('')}${['取り','受け'].map((p,i)=>`<button class="${who===i?'active':''}" onclick="who=${i};render()">${p}</button>`).join('')}</div>${mat(m,phase,true)}<p>投げ・極めの方向</p><div class="row">${dirs.map(d=>`<button class="${m.dir===d?'active':''}" onclick="mv('dir','${d}')">${d}</button>`).join('')}</div><p class="muted">位置をタップして設定。方向は観客席を上として選択。</p></section>${list()}`;if(tab===2){let x=s.moves[preview]||s.moves[0];h=`<section><h2>第${preview+1}技 / ${s.moves.length}</h2><h3>${esc(x.pose)} ${esc(x.attack)} ${esc(x.tech)} ${esc(x.type)}</h3><div class="grid"><div>開始${mat(x,'start',false)}</div><div>終了${mat(x,'end',false)}</div></div><p>方向 ${x.dir} ／ ${esc(x.tempo)} ／ ${esc(x.fall)}</p><div class="row"><button onclick="preview=Math.max(0,preview-1);render()">前へ</button><button class="primary" onclick="preview=(preview+1)%s.moves.length;render()">次へ</button></div></section>`}if(tab===3)h=`<section><h2>模擬採点</h2><div class="score" id="total">${scores.reduce((a,b)=>a+b,0)} / 100</div>${names.map((n,i)=>`<article><b>${n}　<span id="sc${i}">${scores[i]}</span> / ${max[i]}点</b><input style="width:100%" type="range" min="0" max="${max[i]}" value="${scores[i]}" oninput="scores[${i}]=+this.value;$('sc${i}').textContent=this.value;$('total').textContent=scores.reduce((a,b)=>a+b,0)+' / 100'"><details><summary>一年生向けチェック</summary>${criteria[i].map((x,j)=>check(x,i+'-'+j)).join('')}</details></article>`).join('')}<details><summary>演武全体のチェック（加点なし）</summary>${extra.map((x,i)=>check(x,'e'+i)).join('')}</details><label>実測時間（秒）<input type="number" value="${seconds}" onchange="seconds=this.value"></label><label>評価者（任意）<input value="${esc(reviewer)}" onchange="reviewer=this.value"></label><label>動画リンク（任意）<input value="${esc(video)}" onchange="video=this.value"></label><label>次回の課題（任意）<textarea onchange="memo=this.value">${esc(memo)}</textarea></label><button class="primary" onclick="log()">稽古記録を保存</button></section>`;if(tab===4)h=`<section><h2>成長記録</h2>${s.logs.length?s.logs.map((l,i)=>`<article><b>第${i+1}回　${esc(l.date)}</b><div class="score">${l.scores.reduce((a,b)=>a+b,0)}点</div><progress max="100" value="${l.scores.reduce((a,b)=>a+b,0)}"></progress>${names.map((n,j)=>`<div>${n} ${l.scores[j]}/${max[j]}<progress max="${max[j]}" value="${l.scores[j]}"></progress></div>`).join('')}<p>${l.seconds}秒　${esc(l.reviewer)}</p><p>${esc(l.memo)}</p><p>${esc(l.video)}</p><details><summary>当時の技順・チェック結果</summary>${l.moves.map((m,j)=>`<p>${j+1}. ${esc(m.pose)} ${esc(m.side)} ${esc(m.attack)} ${esc(m.tech)} ${esc(m.type)}</p>`).join('')}${criteria.flatMap((a,j)=>a.map((x,k)=>`<p>${l.checks[j+'-'+k]?'✓':'□'} ${x}</p>`)).join('')}${extra.map((x,j)=>`<p>${l.checks['e'+j]?'✓':'□'} ${x}</p>`).join('')}</details></article>`).join(''):'まだ記録がありません。'}</section>`;if(tab===5)h=`<section><h2>共有・バックアップ</h2><p>大会：${esc(s.name)}　${esc(s.date)}</p><p>取り：${esc(s.tori)}　受け：${esc(s.uke)}　制限：${esc(s.limit)}秒</p><button onclick="window.print()">印刷・PDF保存</button> <button onclick="backup()">全記録バックアップ</button><label>バックアップを読み込む（現在の記録を置換）<input type="file" accept=".json" onchange="if(confirm('現在の記録を置き換えますか？'))restore(this.files[0])"></label><button onclick="copyText()">技順をコピー</button></section>${s.moves.map((m,i)=>`<section><b>${i+1}. ${esc(m.pose)} ${esc(m.side)} ${esc(m.attack)} ${esc(m.tech)} ${esc(m.type)}</b><p>${esc(m.fall)} ／ ${esc(m.tempo)} ／ ${m.dir}</p><div class="grid"><div>開始${mat(m,'start',false)}</div><div>終了${mat(m,'end',false)}</div></div></section>`).join('')}`;$('app').innerHTML=h}async function copyText(){let t=[s.name,'取り：'+s.tori+' 受け：'+s.uke,...s.moves.map((m,i)=>`${i+1}. ${m.pose} ${m.side} ${m.attack} ${m.tech} ${m.type} ${m.fall} ${m.dir}`)].join('\n');try{await navigator.clipboard.writeText(t);alert('コピーしました')}catch{prompt('コピーしてください',t)}}render();</script></html>
